name: Build and Release APKs

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get user app
        working-directory: tomas-flutter
        run: flutter pub get

      - name: Build user APK
        working-directory: tomas-flutter
        run: flutter build apk --release --dart-define=TOMAS_SERVER_URL=https://tomas-production.up.railway.app

      - name: Rename user APK
        run: cp "tomas-flutter/build/app/outputs/flutter-apk/app-release.apk" "tomas-user-release.apk"

      - name: Pub get tukang app
        working-directory: tomas-flutter-tukang
        run: flutter pub get

      - name: Build tukang APK
        working-directory: tomas-flutter-tukang
        run: flutter build apk --release --dart-define=TOMAS_SERVER_URL=https://tomas-production.up.railway.app

      - name: Rename tukang APK
        run: cp "tomas-flutter-tukang/build/app/outputs/flutter-apk/app-release.apk" "tomas-tukang-release.apk"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tomas-user-release.apk
            tomas-tukang-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
